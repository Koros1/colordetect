<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorDetect — Renk Psikolojisi Motoru</title>
<style>
  :root{
    --bg:#fbfbfd;
    --ink:#1d1d1f;
    --ink-soft:#6e6e73;
    --line:#d6d6db;
    --line-soft:#eaeaee;
    --card:#ffffff;
    --accent:#5e5cea;
    --accent-dark:#4a48c9;
    --accent-soft:#eeeefd;
    --radius:20px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-weight:600;letter-spacing:-0.02em;margin:0;}
  p{color:var(--ink-soft);line-height:1.6;margin:0;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--font);cursor:pointer;border:none;background:none;}
  ::selection{background:var(--accent-soft);color:var(--accent-dark);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}

  /* NAV */
  .nav{position:sticky;top:0;z-index:100;background:rgba(251,251,253,.78);backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line-soft);}
  .nav-inner{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .logo .mark{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ff6f59);}
  .nav-links{display:flex;gap:28px;font-size:13.5px;color:var(--ink-soft);}
  .nav-links a{transition:color .15s;}
  .nav-links a:hover, .nav-links a.active{color:var(--ink);}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .pill-btn{padding:8px 18px;border-radius:980px;font-size:13.5px;font-weight:500;transition:.15s;}
  .pill-btn.dark{background:var(--ink);color:#fff;}
  .pill-btn.dark:hover{background:#000;}
  .pill-btn.ghost{color:var(--ink);}
  .pill-btn.ghost:hover{color:var(--accent);}

  /* HERO */
  .hero{position:relative;min-height:74vh;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;}
  .orb-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;}
  .hero-content{position:relative;z-index:1;max-width:720px;padding:0 24px;}
  .hero-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:22px;}
  .hero h1{font-size:clamp(38px,6vw,64px);line-height:1.06;}
  .hero p.sub{font-size:19px;margin-top:20px;max-width:560px;margin-left:auto;margin-right:auto;}
  .hero-cta{display:flex;gap:12px;justify-content:center;margin-top:36px;}
  .btn-lg{padding:14px 28px;border-radius:980px;font-size:15px;font-weight:500;transition:.15s;}
  .btn-lg.primary{background:var(--ink);color:#fff;}
  .btn-lg.primary:hover{background:#000;transform:translateY(-1px);}
  .btn-lg.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .btn-lg.secondary:hover{border-color:var(--ink);}

  /* SECTIONS */
  section{padding:96px 0;}
  .section-head{text-align:center;max-width:600px;margin:0 auto 56px;}
  .section-head .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;}
  .section-head h2{font-size:clamp(28px,4vw,40px);}
  .section-head p{margin-top:14px;font-size:16px;}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .feature-card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:32px 28px;}
  .feature-card .icon{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin-bottom:20px;font-size:18px;}
  .feature-card h3{font-size:17px;margin-bottom:8px;}
  .feature-card p{font-size:14.5px;}

  /* CARD / FORM ELEMENTS */
  .card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:32px;}
  .field{margin-top:18px;}
  .field label{display:block;font-size:11.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:8px;}
  .field input[type=text], .field input[type=email], .field input[type=password], .field select{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14.5px;color:var(--ink);font-family:var(--font);
    appearance:none;-webkit-appearance:none;
  }
  .field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236e6e73' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px;}
  .field input:focus, .field select:focus{border-color:var(--accent);}

  /* ANALYZE */
  .analyze-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;}
  .dropzone{border:1.5px dashed var(--line);border-radius:16px;padding:30px;text-align:center;cursor:pointer;transition:.15s;}
  .dropzone:hover{border-color:var(--accent);background:var(--accent-soft);}
  .dropzone img{max-width:100%;max-height:200px;border-radius:12px;margin-top:10px;}
  .dropzone .hint{font-size:13px;color:var(--ink-soft);margin-top:8px;}
  .btn-analyze{width:100%;margin-top:22px;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;transition:.15s;}
  .btn-analyze:hover{background:var(--accent-dark);}
  .btn-analyze:disabled{background:var(--line);color:#fff;cursor:not-allowed;}
  .swatches{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .swatch{flex:1;min-width:88px;border-radius:14px;overflow:hidden;border:1px solid var(--line-soft);}
  .swatch .fill{height:64px;}
  .swatch .meta{padding:9px 10px;background:#fff;}
  .swatch .hex{font-family:var(--mono);font-size:11.5px;}
  .swatch .name{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .ai-summary{margin-top:18px;padding:16px 18px;background:var(--accent-soft);border-radius:14px;font-size:14px;color:var(--accent-dark);}

  .room-3d{perspective:900px;width:100%;height:250px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,#f3f2f7,#e9e8f0);}
  .room-inner{position:relative;width:210px;height:145px;transform-style:preserve-3d;}
  .face{position:absolute;top:50%;left:50%;box-shadow:inset 0 0 40px rgba(0,0,0,.08);}
  .save-row{display:flex;gap:10px;margin-top:20px;}
  .btn-save{flex:1;padding:12px;border-radius:12px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;transition:.15s;}
  .btn-save:hover{background:#000;}
  .btn-save.secondary{background:transparent;border:1px solid var(--line);color:var(--ink);}

  /* MARKET */
  .market-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;gap:16px;flex-wrap:wrap;}
  .search{padding:11px 18px;border-radius:980px;border:1px solid var(--line);background:#fff;font-size:14px;width:280px;font-family:var(--font);}
  .search:focus{border-color:var(--accent);}
  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;}
  .product-card{background:var(--card);border:1px solid var(--line-soft);border-radius:18px;overflow:hidden;cursor:pointer;transition:.2s;}
  .product-card:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(0,0,0,.08);}
  .product-thumb{height:150px;display:flex;}
  .product-thumb .seg{flex:1;}
  .product-body{padding:16px 18px;}
  .product-body .who{font-size:11px;font-family:var(--mono);color:var(--ink-soft);margin-bottom:5px;}
  .product-body h3{font-size:15.5px;}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0;}
  .tag{font-size:10.5px;padding:4px 10px;border-radius:980px;background:var(--accent-soft);color:var(--accent-dark);font-family:var(--mono);}
  .meta-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .empty{text-align:center;padding:70px 20px;color:var(--ink-soft);}
  .empty .btn-lg{margin-top:18px;}

  /* DETAIL */
  .detail-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;}
  .detail-thumb{height:290px;border-radius:18px;overflow:hidden;display:flex;border:1px solid var(--line-soft);}
  .detail-thumb .seg{flex:1;}
  .like-btn{padding:10px 18px;border-radius:980px;border:1px solid var(--line);background:#fff;font-size:13.5px;transition:.15s;}
  .like-btn.liked{background:#fff0ee;border-color:#ff6f59;color:#c0442f;}
  .comment{padding:14px 0;border-bottom:1px solid var(--line-soft);}
  .comment .who{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);}
  .comment p{margin:5px 0 0;font-size:14px;color:var(--ink);}
  .comment-input{display:flex;gap:8px;margin-top:16px;}
  .comment-input input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);font-family:var(--font);}
  .back-link{font-size:13px;color:var(--ink-soft);margin-bottom:22px;display:inline-block;cursor:pointer;}
  .back-link:hover{color:var(--ink);}

  /* MODAL */
  .modal-backdrop{position:fixed;inset:0;background:rgba(29,29,31,.4);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{background:#fff;border-radius:22px;padding:36px;max-width:400px;width:100%;}
  .modal h2{font-size:22px;margin-bottom:4px;}
  .modal .sub{font-size:13.5px;margin-top:6px;}
  .modal-tabs{display:flex;gap:6px;margin-top:20px;background:var(--accent-soft);padding:4px;border-radius:12px;}
  .modal-tab{flex:1;padding:9px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink-soft);transition:.15s;}
  .modal-tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .modal-error{margin-top:14px;padding:10px 14px;background:#fff0ee;color:#c0442f;border-radius:10px;font-size:13px;}
  .modal-close{position:absolute;top:20px;right:20px;font-size:20px;color:var(--ink-soft);}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:980px;font-size:13.5px;z-index:2000;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .loading-spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  footer{border-top:1px solid var(--line-soft);padding:40px 0;text-align:center;font-size:12.5px;color:var(--ink-soft);}

  /* FLOATING AI BUTTON */
  .fab{position:fixed;right:22px;bottom:22px;z-index:500;display:flex;align-items:center;gap:9px;
    padding:14px 20px 14px 16px;border-radius:980px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.22);transition:transform .18s, box-shadow .18s;}
  .fab:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(0,0,0,.28);}
  .fab .fab-dot{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 90deg,var(--accent),#ff6f59,#ffd76a,#5ad1a6,var(--accent));
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .fab .fab-dot::after{content:'';width:10px;height:10px;border-radius:50%;background:#fff;}
  @media(max-width:640px){ .fab span.fab-label{display:none;} .fab{padding:14px;} }

  @media(max-width:820px){
    .analyze-grid, .detail-grid, .grid3{grid-template-columns:1fr;}
    .nav-links{display:none;}
    .hero h1{font-size:34px;}
  }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-inner">
    <div class="logo"><span class="mark"></span>ColorDetect</div>
    <div class="nav-links" id="navLinks"></div>
    <div class="nav-right" id="navRight"></div>
  </div>
</div>

<div id="app"></div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<button class="fab" id="fabButton" onclick="handleFabClick()">
  <span class="fab-dot"></span><span class="fab-label">ColorDetect AI</span>
</button>

<script>
const API_BASE = 'https://colordetect-backend.onrender.com';

/* ============ STATE ============ */
const AGE_OPTS=[
  {v:'child',l:'Çocuk (0-12)'},{v:'teen',l:'Genç (13-18)'},{v:'young',l:'Genç Yetişkin (19-30)'},
  {v:'adult',l:'Yetişkin (31-50)'},{v:'senior',l:'Orta Yaş ve Üzeri (50+)'},
];
const PURPOSE_OPTS=[
  {v:'home',l:'Yaşam Alanı (Ev/Oda)'},{v:'office',l:'Çalışma Alanı / Ofis'},{v:'branding',l:'Ürün / Marka Tasarımı'},
  {v:'health',l:'Sağlık / Wellness Mekanı'},{v:'education',l:'Eğitim Alanı'},{v:'retail',l:'Ticari Mekan (Mağaza/Restoran)'},
];
const PLACE_OPTS=[
  {v:'indoor',l:'İç Mekan'},{v:'outdoor',l:'Dış Mekan'},{v:'digital',l:'Dijital (Ekran)'},{v:'print',l:'Baskı / Ambalaj'},
];
function label(opts,v){return (opts.find(o=>o.v===v)||{}).l||v;}

let AUTH = null;
try{ const raw=localStorage.getItem('cd_auth'); if(raw) AUTH=JSON.parse(raw); }catch(e){}

const S={ view:'home', productDetailId:null, imgDataUrl:null, imgBase64:null, imgMediaType:null, prefs:{age:'young',purpose:'home',place:'indoor'}, result:null, roomRotation:20 };

function setView(v,extra){ S.view=v; if(extra) Object.assign(S,extra); render(); window.scrollTo(0,0); }
window.setView = setView;

/* Her yerden erişilebilen ColorDetect AI butonu: tıklanınca doğrudan
   analiz akışına götürür (mağaza sahibi ya da normal kullanıcı fark etmeksizin) */
function handleFabClick(){
  if(S.view!=='analyze'){ setView('analyze'); }
  else{ document.getElementById('fileInput')?.click(); }
}
window.handleFabClick = handleFabClick;

/* ============ API HELPER ============ */
async function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(AUTH && AUTH.token) headers['Authorization'] = 'Bearer ' + AUTH.token;
  const res = await fetch(API_BASE + path, { ...opts, headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){ throw new Error((data && data.error) || `Sunucu hatası (${res.status})`); }
  return data;
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove('show'), 3200);
}
window.toast = toast;

/* ============ AUTH ============ */
function setAuth(a){
  AUTH=a;
  try{ localStorage.setItem('cd_auth', JSON.stringify(a)); }catch(e){}
  renderNav();
}
function logout(){
  AUTH=null;
  try{ localStorage.removeItem('cd_auth'); }catch(e){}
  toast('Çıkış yapıldı.');
  renderNav();
  setView('home');
}
window.logout = logout;

let authTab = 'login';
function openAuthModal(tab){
  authTab = tab || 'login';
  document.getElementById('modalRoot').innerHTML = renderAuthModal();
}
window.openAuthModal = openAuthModal;
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
window.closeModal = closeModal;
function switchAuthTab(t){ authTab=t; document.getElementById('modalRoot').innerHTML=renderAuthModal(); }
window.switchAuthTab = switchAuthTab;

function renderAuthModal(){
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal" style="position:relative;">
      <span class="modal-close" onclick="closeModal()">✕</span>
      <h2>${authTab==='login' ? 'Tekrar hoş geldin' : 'Hesap oluştur'}</h2>
      <p class="sub">${authTab==='login' ? 'Devam etmek için giriş yap.' : 'Renk analizlerini kaydetmek için bir hesap oluştur.'}</p>
      <div class="modal-tabs">
        <button class="modal-tab ${authTab==='login'?'active':''}" onclick="switchAuthTab('login')">Giriş Yap</button>
        <button class="modal-tab ${authTab==='signup'?'active':''}" onclick="switchAuthTab('signup')">Kayıt Ol</button>
      </div>
      <div id="authFormArea">
        ${authTab==='login' ? `
          <div class="field"><label>E-posta</label><input type="email" id="loginEmail"></div>
          <div class="field"><label>Şifre</label><input type="password" id="loginPassword"></div>
          <button class="btn-analyze" id="authSubmitBtn" onclick="submitLogin()">Giriş Yap</button>
        ` : `
          <div class="field"><label>İsim</label><input type="text" id="signupName"></div>
          <div class="field"><label>E-posta</label><input type="email" id="signupEmail"></div>
          <div class="field"><label>Şifre (en az 8 karakter)</label><input type="password" id="signupPassword"></div>
          <button class="btn-analyze" id="authSubmitBtn" onclick="submitSignup()">Kayıt Ol</button>
        `}
      </div>
      <div id="authErrorArea"></div>
    </div>
  </div>`;
}
function showAuthError(msg){
  document.getElementById('authErrorArea').innerHTML = `<div class="modal-error">${msg}</div>`;
}
function setAuthLoading(loading){
  const btn=document.getElementById('authSubmitBtn');
  if(!btn) return;
  btn.disabled=loading;
  btn.innerHTML = loading ? '<span class="loading-spinner"></span>Yükleniyor' : btn.dataset.label || btn.innerHTML;
}
async function submitLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  if(!email || !password) return showAuthError('E-posta ve şifre gerekli.');
  const btn=document.getElementById('authSubmitBtn'); btn.dataset.label='Giriş Yap';
  setAuthLoading(true);
  try{
    const data = await api('/api/auth/login', { method:'POST', body:{email,password} });
    setAuth(data);
    closeModal();
    toast(`Hoş geldin, ${data.user.name}.`);
    render();
  }catch(e){ setAuthLoading(false); showAuthError(e.message); }
}
window.submitLogin = submitLogin;
async function submitSignup(){
  const name=document.getElementById('signupName').value.trim();
  const email=document.getElementById('signupEmail').value.trim();
  const password=document.getElementById('signupPassword').value;
  if(!name || !email || !password) return showAuthError('Tüm alanları doldur.');
  const btn=document.getElementById('authSubmitBtn'); btn.dataset.label='Kayıt Ol';
  setAuthLoading(true);
  try{
    const data = await api('/api/auth/signup', { method:'POST', body:{name,email,password} });
    setAuth(data);
    closeModal();
    toast(`Hesabın oluşturuldu, hoş geldin ${data.user.name}.`);
    render();
  }catch(e){ setAuthLoading(false); showAuthError(e.message); }
}
window.submitSignup = submitSignup;

/* ============ NAV ============ */
function renderNav(){
  const links=[['home','Ana Sayfa'],['analyze','Analiz'],['market','Pazar Yeri'],['profile','Profil']];
  document.getElementById('navLinks').innerHTML = links.map(([v,l])=>
    `<a href="javascript:void(0)" class="${S.view===v?'active':''}" onclick="setView('${v}')">${l}</a>`).join('');
  const right=document.getElementById('navRight');
  if(AUTH){
    right.innerHTML = `<span class="pill-btn ghost" style="cursor:default;">${AUTH.user.name}</span><button class="pill-btn dark" onclick="logout()">Çıkış</button>`;
  }else{
    right.innerHTML = `<button class="pill-btn ghost" onclick="openAuthModal('login')">Giriş Yap</button><button class="pill-btn dark" onclick="openAuthModal('signup')">Kayıt Ol</button>`;
  }
}

/* ============ HOME ============ */
function renderHome(){
  return `
  <div class="hero">
    <canvas class="orb-canvas" id="orbCanvas"></canvas>
    <div class="hero-content">
      <div class="hero-eyebrow">Renk Psikolojisi Motoru</div>
      <h1>Doğru renk,<br>tesadüf değil bir karardır.</h1>
      <p class="sub">Bir nesne ya da tasarım yükle; yaş grubu, kullanım amacı ve yerine göre psikolojiye uygun renk paleti al, 3D önizle, Pazar Yeri'nde paylaş.</p>
      <div class="hero-cta">
        <button class="btn-lg primary" onclick="setView('analyze')">Renk Analizi Başlat</button>
        <button class="btn-lg secondary" onclick="setView('market')">Pazar Yerini Gez</button>
      </div>
    </div>
  </div>

  <section>
    <div class="wrap">
      <div class="section-head">
        <div class="eyebrow">Nasıl Çalışır</div>
        <h2>Üç adımda, bilime dayalı bir palet</h2>
      </div>
      <div class="grid3">
        <div class="feature-card"><div class="icon">◐</div><h3>Yükle & Tanımla</h3><p>Görselini yükle, yaş grubu, kullanım amacı ve kullanım yerini seç.</p></div>
        <div class="feature-card"><div class="icon">✦</div><h3>Yapay Zeka Analiz Etsin</h3><p>Görseldeki nesneyi ve renkleri tanıyan bir motor, renk psikolojisi kurallarıyla paleti optimize eder.</p></div>
        <div class="feature-card"><div class="icon">◆</div><h3>Gör & Paylaş</h3><p>3D önizlemede sonucu incele, kaydet, dilersen Pazar Yeri'nde paylaş.</p></div>
      </div>

  <section style="padding-top:0;">

      <div class="grid3">

        <div class="feature-card"><h3>Marka & Algı</h3><p>Doğru kombinasyon, bir ürünün algılanan güvenilirliğini değiştirir.</p></div>
        <div class="feature-card"><h3>Yaşa Duyarlılık</h3><p>Çocuklar, gençler ve yetişkinler renklere farklı tepki verir — tek tip renklendirme herkese uymaz.</p></div>
      </div>
    </div>

  `;
}
function animateOrbs(){
  const c=document.getElementById('orbCanvas');
  if(!c) return;
  const ctx=c.getContext('2d');
  function resize(){ c.width=c.offsetWidth; c.height=c.offsetHeight; }
  resize();
  const orbs=[ {x:.28,y:.4,r:.34,h:245}, {x:.72,y:.55,r:.3,h:20} ];
  let t=0, raf;
  function frame(){
    if(!document.getElementById('orbCanvas')) return;
    t+=0.0032;
    ctx.clearRect(0,0,c.width,c.height);
    ctx.filter='blur(70px)';
    orbs.forEach((o,i)=>{
      const h=(o.h + t*14)%360;
      const x=(o.x + Math.sin(t*1.3+i*2)*0.05)*c.width;
      const y=(o.y + Math.cos(t*1.1+i*2)*0.05)*c.height;
      const r=o.r*Math.min(c.width,c.height);
      const g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,`hsla(${h},70%,68%,0.5)`);
      g.addColorStop(1,'hsla(0,0%,0%,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    });
    ctx.filter='none';
    raf=requestAnimationFrame(frame);
  }
  frame();
}

/* ============ ANALYZE ============ */
function renderAnalyze(){
  const p = S.prefs;
  return `
  <section style="padding-top:52px;">
    <div class="wrap">
      <div class="section-head" style="margin-bottom:40px;">
        <div class="eyebrow">Analiz</div>
        <h2>Renk Analizi</h2>
      </div>
      <div class="analyze-grid">
        <div class="card">
          <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
            ${S.imgDataUrl ? `<img src="${S.imgDataUrl}"/>` : `<div>📷<br><b>Görsel yükle</b><div class="hint">Nesne, tasarım ya da mekan fotoğrafı</div></div>`}
          </div>
          <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onFileChosen(event)">

          <div class="field"><label>Hedef Yaş Grubu</label>
            <select onchange="S.prefs.age=this.value">
              ${AGE_OPTS.map(o=>`<option value="${o.v}" ${p.age===o.v?'selected':''}>${o.l}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Kullanım Amacı</label>
            <select onchange="S.prefs.purpose=this.value">
              ${PURPOSE_OPTS.map(o=>`<option value="${o.v}" ${p.purpose===o.v?'selected':''}>${o.l}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Kullanım Yeri</label>
            <select onchange="S.prefs.place=this.value">
              ${PLACE_OPTS.map(o=>`<option value="${o.v}" ${p.place===o.v?'selected':''}>${o.l}</option>`).join('')}
            </select>
          </div>

          <button class="btn-analyze" id="analyzeBtn" onclick="runAnalysis()" ${!S.imgBase64?'disabled':''}>Analiz Et</button>

          ${S.result ? `
            <div class="swatches">
              ${S.result.palette.map(c=>`
                <div class="swatch">
                  <div class="fill" style="background:${c.hex}"></div>
                  <div class="meta"><div class="hex">${c.hex}</div><div class="name">${c.name}</div></div>
                </div>`).join('')}
            </div>
            <div class="ai-summary">${S.result.summary}</div>
          ` : ''}
        </div>

        <div class="card">
          <h3 style="font-size:16px;margin-bottom:14px;">3D Önizleme</h3>
          <div class="room-3d" id="room3d" onmousemove="dragRoom(event)"><div class="room-inner" id="roomInner"></div></div>
          <div style="font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:10px;">fare ile sürükleyerek döndür</div>
          ${S.result ? `
            <div class="save-row">
              <button class="btn-save" onclick="publishAnalysis()">Pazar Yerinde Paylaş</button>
              <button class="btn-save secondary" onclick="setView('profile')">Profile Git</button>
            </div>
          ` : `<p style="font-size:13.5px;text-align:center;margin-top:16px;">Analiz sonrası 3D önizleme burada görünecek.</p>`}
        </div>
      </div>
    </div>
  </section>
  `;
}
function onFileChosen(ev){
  const file=ev.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const maxW=900; const scale=Math.min(1,maxW/img.width);
      c.width=img.width*scale; c.height=img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      S.imgDataUrl=c.toDataURL('image/jpeg',0.85);
      S.imgBase64=S.imgDataUrl.split(',')[1];
      S.imgMediaType='image/jpeg';
      S.result=null;
      render();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
window.onFileChosen = onFileChosen;

async function runAnalysis(){
  if(!AUTH){ openAuthModal('login'); toast('Analiz için önce giriş yapmalısın.'); return; }
  if(!S.imgBase64) return;
  const btn=document.getElementById('analyzeBtn');
  btn.disabled=true; btn.innerHTML='<span class="loading-spinner"></span>Analiz ediliyor';
  try{
    const data = await api('/api/analyze', { method:'POST', body:{
      imageBase64:S.imgBase64, mediaType:S.imgMediaType,
      age:S.prefs.age, purpose:S.prefs.purpose, place:S.prefs.place, save:true,
    }});
    S.result = data;
    S.currentAnalysisId = data.analysisId;
    render();
    requestAnimationFrame(initRoom);
  }catch(e){
    toast(e.message);
    render();
  }
}
window.runAnalysis = runAnalysis;

function initRoom(){
  const inner=document.getElementById('roomInner');
  if(!inner || !S.result) return;
  const p=S.result.palette; const W=210,H=145,D=170;
  inner.innerHTML=`
    <div class="face" style="width:${W}px;height:${H}px;background:${p[0].hex};transform:translate(-50%,-50%) translateZ(${-D/2}px);"></div>
    <div class="face" style="width:${D}px;height:${H}px;background:${p[1]?p[1].hex:p[0].hex};transform:translate(-50%,-50%) rotateY(-90deg) translateZ(${-W/2}px);"></div>
    <div class="face" style="width:${W}px;height:${D}px;background:${p[2]?p[2].hex:p[0].hex};transform:translate(-50%,-50%) rotateX(90deg) translateZ(${-H/2}px);"></div>
    <div class="face" style="width:52px;height:52px;background:${p[4]?p[4].hex:p[0].hex};border-radius:8px;box-shadow:0 8px 18px rgba(0,0,0,.25);transform:translate(-50%,-50%) translateZ(${-D/2+38}px) translateY(28px);"></div>
  `;
  applyRoomRotation();
}
function applyRoomRotation(){
  const inner=document.getElementById('roomInner');
  if(!inner) return;
  inner.style.transform=`rotateX(-12deg) rotateY(${S.roomRotation}deg)`;
}
let dragging=false, lastX=0;
function dragRoom(ev){
  if(ev.buttons!==1) return;
  if(!dragging){ dragging=true; lastX=ev.clientX; return; }
  const dx=ev.clientX-lastX; lastX=ev.clientX;
  S.roomRotation += dx*0.5;
  applyRoomRotation();
}
window.dragRoom = dragRoom;
document.addEventListener('mouseup', ()=>dragging=false);

async function publishAnalysis(){
  if(!S.currentAnalysisId) return;
  try{
    await api(`/api/products/${S.currentAnalysisId}/publish`, { method:'POST' });
    toast(`Pazar Yeri'nde paylaşıldı.`);
    MARKET_CACHE=null;
    setView('market');
  }catch(e){ toast(e.message); }
}
window.publishAnalysis = publishAnalysis;

/* ============ MARKET ============ */
let MARKET_CACHE=null;
async function loadMarket(q){
  try{
    const qs = q ? `?q=${encodeURIComponent(q)}` : '';
    const data = await api('/api/products' + qs);
    MARKET_CACHE = data.items;
  }catch(e){ MARKET_CACHE = []; toast(e.message); }
  if(S.view==='market') render();
}
function renderMarket(){
  if(MARKET_CACHE===null){ loadMarket(); }
  return `
  <section style="padding-top:52px;">
    <div class="wrap">
      <div class="market-toolbar">
        <div><div class="hero-eyebrow" style="margin-bottom:6px;">Pazar Yeri</div><h2 style="font-size:28px;">Toplulukla paylaşılan paletler</h2></div>
        <input class="search" id="marketSearch" placeholder="Amaç, yaş grubu ya da kişi ara..." oninput="onMarketSearch(this.value)">
      </div>
      <div class="product-grid" id="productGrid">${renderProductGrid()}</div>
    </div>
  </section>
  `;
}
let searchDebounce;
function onMarketSearch(q){
  clearTimeout(searchDebounce);
  searchDebounce=setTimeout(()=>loadMarket(q), 350);
}
window.onMarketSearch = onMarketSearch;
function renderProductGrid(){
  if(MARKET_CACHE===null) return `<div class="empty">Yükleniyor...</div>`;
  if(!MARKET_CACHE.length) return `<div class="empty">Henüz paylaşılan bir palet yok.<br>İlk paylaşan sen ol.<button class="btn-lg primary" onclick="setView('analyze')">Analiz Yap</button></div>`;
  return MARKET_CACHE.map(p=>`
    <div class="product-card" onclick="openProduct('${p.id}')">
      <div class="product-thumb">${p.palette.map(c=>`<div class="seg" style="background:${c.hex}"></div>`).join('')}</div>
      <div class="product-body">
        <div class="who">${p.author}</div>
        <h3>${label(PURPOSE_OPTS,p.purpose)}</h3>
        <div class="tag-row"><span class="tag">${label(AGE_OPTS,p.age_group)}</span><span class="tag">${label(PLACE_OPTS,p.place)}</span></div>
        <div class="meta-row"><span>♥ ${p.like_count}</span><span>💬 ${p.comment_count}</span></div>
      </div>
    </div>
  `).join('');
}

let LIKES_STATE={}, COMMENTS_STATE=[], PRODUCT_STATE=null;
async function openProduct(id){
  S.productDetailId=id;
  PRODUCT_STATE=null;
  setView('detail');
  try{
    const data = await api(`/api/products/${id}`);
    PRODUCT_STATE = data.product;
    COMMENTS_STATE = data.comments;
    LIKES_STATE = { liked:data.liked, saved:data.saved };
    render();
  }catch(e){ toast(e.message); }
}
window.openProduct = openProduct;

function renderDetail(){
  if(!PRODUCT_STATE) return `<section class="wrap" style="padding-top:52px;"><p>Yükleniyor...</p></section>`;
  const p=PRODUCT_STATE;
  return `
  <section style="padding-top:52px;">
    <div class="wrap">
      <span class="back-link" onclick="setView('market')">← Pazar Yerine Dön</span>
      <div class="detail-grid">
        <div>
          <div class="detail-thumb">${p.palette.map(c=>`<div class="seg" style="background:${c.hex}"></div>`).join('')}</div>
          <div class="swatches" style="margin-top:16px;">
            ${p.palette.map(c=>`<div class="swatch"><div class="fill" style="background:${c.hex}"></div><div class="meta"><div class="hex">${c.hex}</div><div class="name">${c.name}</div></div></div>`).join('')}
          </div>
        </div>
        <div>
          <div class="hero-eyebrow">${p.author} tarafından paylaşıldı</div>
          <h2 style="font-size:26px;margin-top:8px;">${label(PURPOSE_OPTS,p.purpose)}</h2>
          <div class="tag-row"><span class="tag">${label(AGE_OPTS,p.age_group)}</span><span class="tag">${label(PLACE_OPTS,p.place)}</span></div>
          <p style="margin-top:14px;">${p.summary || ''}</p>
          <div style="display:flex;gap:10px;margin:22px 0;">
            <button class="like-btn ${LIKES_STATE.liked?'liked':''}" onclick="toggleLike('${p.id}')">${LIKES_STATE.liked?'♥':'♡'} Beğen (${p.like_count})</button>
            <button class="btn-lg secondary" style="padding:10px 20px;" onclick="toggleSave('${p.id}')">${LIKES_STATE.saved?'Kaydedildi ✓':'Kaydet'}</button>
          </div>
          <h3 style="font-size:15.5px;margin-top:26px;">Yorumlar (${COMMENTS_STATE.length})</h3>
          <div>${COMMENTS_STATE.map(c=>`<div class="comment"><div class="who">${c.author}</div><p>${c.text}</p></div>`).join('') || '<p style="font-size:13.5px;">Henüz yorum yok.</p>'}</div>
          <div class="comment-input">
            <input type="text" id="commentInput" placeholder="Yorum yaz...">
            <button class="btn-save" style="width:auto;padding:11px 20px;" onclick="postComment('${p.id}')">Gönder</button>
          </div>
        </div>
      </div>
    </div>
  </section>
  `;
}
async function toggleLike(id){
  if(!AUTH){ openAuthModal('login'); return; }
  try{
    const data = await api(`/api/products/${id}/like`, { method:'POST' });
    LIKES_STATE.liked = data.liked;
    PRODUCT_STATE.like_count = Number(PRODUCT_STATE.like_count) + (data.liked ? 1 : -1);
    render();
  }catch(e){ toast(e.message); }
}
window.toggleLike = toggleLike;
async function toggleSave(id){
  if(!AUTH){ openAuthModal('login'); return; }
  try{
    const data = await api(`/api/products/${id}/save`, { method:'POST' });
    LIKES_STATE.saved = data.saved;
    toast(data.saved ? 'Profiline kaydedildi.' : 'Kayıttan kaldırıldı.');
    render();
  }catch(e){ toast(e.message); }
}
window.toggleSave = toggleSave;
async function postComment(id){
  if(!AUTH){ openAuthModal('login'); return; }
  const input=document.getElementById('commentInput');
  const text=input.value.trim();
  if(!text) return;
  try{
    const c = await api(`/api/products/${id}/comments`, { method:'POST', body:{text} });
    COMMENTS_STATE.push({ id:c.id, text:c.text, created_at:c.created_at, author:AUTH.user.name });
    render();
  }catch(e){ toast(e.message); }
}
window.postComment = postComment;

/* ============ PROFILE ============ */
let PROFILE_MINE=null, PROFILE_SAVED=null;
async function loadProfile(){
  try{
    const [mine, saved] = await Promise.all([ api('/api/products/mine'), api('/api/products/mine/saved') ]);
    PROFILE_MINE = mine.items; PROFILE_SAVED = saved.items;
  }catch(e){ toast(e.message); PROFILE_MINE=[]; PROFILE_SAVED=[]; }
  if(S.view==='profile') render();
}
function renderProfile(){
  if(!AUTH){
    return `<section class="wrap" style="padding-top:80px;"><div class="empty">Profilini görmek için giriş yap.<button class="btn-lg primary" onclick="openAuthModal('login')">Giriş Yap</button></div></section>`;
  }
  if(PROFILE_MINE===null){ loadProfile(); return `<section class="wrap" style="padding-top:80px;"><div class="empty">Yükleniyor...</div></section>`; }
  return `
  <section style="padding-top:52px;">
    <div class="wrap">
      <div class="hero-eyebrow">Profil</div>
      <h2 style="font-size:28px;margin-top:8px;">${AUTH.user.name}</h2>
      <p style="margin-top:8px;">Tüm analizlerin (özel ya da herkese açık) burada listelenir.</p>

      <h3 style="font-size:16px;margin-top:40px;margin-bottom:16px;">Analizlerim (${PROFILE_MINE.length})</h3>
      <div class="product-grid" style="margin-bottom:48px;">
        ${PROFILE_MINE.length ? PROFILE_MINE.map(p=>`
          <div class="product-card" ${p.is_public?`onclick="openProduct('${p.id}')"`:''}>
            <div class="product-thumb">${p.palette.map(c=>`<div class="seg" style="background:${c.hex}"></div>`).join('')}</div>
            <div class="product-body">
              <h3>${label(PURPOSE_OPTS,p.purpose)}</h3>
              <div class="tag-row"><span class="tag">${label(AGE_OPTS,p.age_group)}</span>${p.is_public?'<span class="tag">Herkese Açık</span>':'<span class="tag">Özel</span>'}</div>
            </div>
          </div>`).join('') : '<div class="empty">Henüz bir analizin yok.</div>'}
      </div>

      <h3 style="font-size:16px;margin-bottom:16px;">Kaydettiklerim (${PROFILE_SAVED.length})</h3>
      <div class="product-grid">
        ${PROFILE_SAVED.length ? PROFILE_SAVED.map(p=>`
          <div class="product-card" onclick="openProduct('${p.id}')">
            <div class="product-thumb">${p.palette.map(c=>`<div class="seg" style="background:${c.hex}"></div>`).join('')}</div>
            <div class="product-body"><div class="who">${p.author}</div><h3>${label(PURPOSE_OPTS,p.purpose||'home')}</h3></div>
          </div>`).join('') : '<div class="empty">Henüz kaydettiğin bir şey yok.</div>'}
      </div>
    </div>
  </section>
  `;
}

/* ============ ROOT RENDER ============ */
function render(){
  renderNav();
  const app=document.getElementById('app');
  if(S.view==='home'){ app.innerHTML=renderHome(); requestAnimationFrame(animateOrbs); }
  else if(S.view==='analyze'){ app.innerHTML=renderAnalyze(); if(S.result) requestAnimationFrame(initRoom); }
  else if(S.view==='market'){ app.innerHTML=renderMarket(); }
  else if(S.view==='detail'){ app.innerHTML=renderDetail(); }
  else if(S.view==='profile'){ app.innerHTML=renderProfile(); }
  app.innerHTML += `<footer>ColorDetect — renk psikolojisine dayalı analiz ve paylaşım platformu.</footer>`;
}
render();
</script>
